<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OnlineCathedral</title>
<style>
:root{
  --bg-page:#111114;
  --hilite-text:#f2f1ec;
  --dim-text:rgba(240,238,232,0.62);
  --dim-text-2:rgba(240,238,232,0.4);
  --line-soft:rgba(255,255,255,0.09);
  --line-dashed:rgba(255,255,255,0.17);
  --panel-bg:transparent;
  --panel-bg-soft:transparent;
  --panel-bg-med:transparent;
  --panel-bg-strong:transparent;
  --glass-highlight:rgba(255,255,255,0.1);
  --glass-highlight-2:rgba(255,255,255,0.13);
  --shadow-1:rgba(0,0,0,0.55);
  --shadow-2:rgba(0,0,0,0.4);
  --shadow-soft:rgba(0,0,0,0.35);
  --shadow-med:rgba(0,0,0,0.45);
  --shadow-lift:rgba(0,0,0,0.6);
  --scrollbar-thumb:rgba(255,255,255,0.16);
  --star-gold:#e0a942;
  --star-gold-glow:rgba(224,169,66,0.55);
  --accent-track:#f2f1ec;
  --icon-stroke:#f2f1ec;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg-page);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;overflow-x:hidden;transition:background .5s ease;}

#waveStage{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:var(--bg-page);overflow:hidden;}
.wave-canvas-layer{
  position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;
  width:calc(100% + 80px);height:calc(100% + 80px);
  transition:opacity 1.15s ease;background-size:cover;background-position:center;background-repeat:no-repeat;
  will-change:opacity,filter;
}
#waveLayerB{opacity:0;}
@keyframes bgBlurPulse{
  0%{ filter:blur(0px) saturate(1); }
  45%{ filter:blur(15px) saturate(0.65); }
  100%{ filter:blur(0px) saturate(1); }
}
.wave-canvas-layer.bg-transitioning{ animation:bgBlurPulse 1.15s ease; }

.bg-wrap{position:relative;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 10px;z-index:1;}

.stage{position:relative;width:960px;max-width:100%;z-index:2;display:flex;align-items:stretch;justify-content:center;gap:40px;}

.floater{
  background:transparent;border:none;border-radius:10px;position:relative;
  filter: drop-shadow(0 18px 34px var(--shadow-1)) drop-shadow(0 2px 6px var(--shadow-2));
}

@property --hue{
  syntax:'<number>';
  initial-value:0;
  inherits:false;
}
@keyframes hueShift{
  from{ --hue:0; }
  to{ --hue:360; }
}
.mc-border{
  position:relative;
}
.mc-border::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background: conic-gradient(from calc(var(--hue) * 1deg),
    rgba(255,120,120,0.35), rgba(255,210,120,0.35), rgba(150,230,150,0.35),
    rgba(120,190,255,0.35), rgba(200,150,255,0.35), rgba(255,120,120,0.35));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: hueShift 8s linear infinite;
  pointer-events:none;
  opacity:0.8;
  transition:opacity .3s ease;
}
.content-cell.active.mc-border::after{ opacity:0; }
.content-cell.mc-border::after{ animation:none; }

.left-col{position:relative;width:560px;min-height:760px;display:flex;flex-direction:column;}
.left-frame{flex:1;display:flex;flex-direction:column;padding:14px;}
.left-screen{
  position:relative;flex:1;
  background:var(--panel-bg);
  border-radius:8px;
  box-shadow:0 20px 50px var(--shadow-1);
  overflow:hidden;display:flex;flex-direction:column;
  transition:background .5s ease;
}

.display-title-bar{position:relative;z-index:4;padding:16px 44px 12px 44px;border-bottom:1px solid var(--line-soft);text-align:center;}
.display-title-bar .eyebrow{font-size:9px;letter-spacing:3px;color:var(--dim-text-2);text-transform:uppercase;margin-bottom:4px;}
.display-title-bar h2{margin:0;font-size:20px;color:var(--hilite-text);font-weight:600;letter-spacing:0.3px;}
.disp-subtitle{display:none;margin-top:3px;font-size:12px;color:var(--dim-text);letter-spacing:0.3px;font-family:"Courier New",monospace;}

.icon-btn{
  border:none;background:transparent;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--hilite-text);
  filter:drop-shadow(0 1px 4px rgba(0,0,0,0.6));
  transition:opacity .2s ease, transform .15s ease;
}
.icon-btn:hover{opacity:0.68;}
.icon-btn:active{transform:scale(0.92);}
.icon-btn:disabled{opacity:0.3;cursor:default;transform:none;}

.fav-toggle-btn{
  position:absolute;top:16px;right:14px;z-index:6;
  width:22px;height:22px;
}
.fav-toggle-btn svg{fill:none;stroke:var(--dim-text);stroke-width:1.6;transition:all .2s ease;}
.fav-toggle-btn.active svg{fill:var(--star-gold);stroke:var(--star-gold);}

.disp-back-arrow{
  position:absolute;top:16px;left:14px;z-index:6;
  width:22px;height:22px;
}
.display-title-bar{padding-left:44px;}

.artist-browse-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.artist-browse-art{width:56px;height:56px;border-radius:8px;flex-shrink:0;background-size:cover;box-shadow:0 6px 16px var(--shadow-med);}
.artist-browse-text h3{margin:0 0 3px 0;font-size:14px;color:var(--hilite-text);}
.artist-browse-text p{margin:0;font-size:11px;color:var(--dim-text);font-family:"Courier New",monospace;}

.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.album-cell{
  position:relative;
  border-radius:8px;overflow:hidden;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--glass-highlight);
  transition:all .2s ease;
}
.album-cell:hover{box-shadow:inset 0 0 0 1px var(--glass-highlight-2);transform:translateY(-2px);}
.album-cell-art{height:96px;background-size:cover;background-position:center;}
.album-cell-label{padding:8px 10px 10px 10px;}
.album-cell-label h4{margin:0 0 2px 0;font-size:11.5px;color:var(--hilite-text);}
.album-cell-label p{margin:0;font-size:9.5px;color:var(--dim-text-2);font-family:"Courier New",monospace;}

.album-detail-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.album-detail-art{width:64px;height:64px;border-radius:8px;flex-shrink:0;background-size:cover;box-shadow:0 8px 18px var(--shadow-med);}
.album-detail-text h3{margin:0 0 3px 0;font-size:15px;color:var(--hilite-text);}
.album-detail-text p{margin:0;font-size:11px;color:var(--dim-text);font-family:"Courier New",monospace;}

.song-list{display:flex;flex-direction:column;gap:6px;}
.song-row{
  position:relative;
  display:flex;align-items:center;gap:10px;padding:9px 34px 9px 12px;border-radius:6px;cursor:pointer;
  box-shadow:inset 0 0 0 1px transparent;
  transition:all .15s ease;
}
.song-row .song-fav-star{position:absolute;top:50%;right:22px;transform:translateY(-50%);}
.song-row .song-row-play{position:absolute;top:50%;right:4px;transform:translateY(-50%);}
.song-row:hover{box-shadow:inset 0 0 0 1px var(--glass-highlight-2);}
.song-row-num{font-size:10px;color:var(--dim-text-2);font-family:"Courier New",monospace;width:16px;text-align:center;flex-shrink:0;}
.song-row-text{flex:1;min-width:0;}
.song-row-text h4{margin:0 0 2px 0;font-size:11.5px;color:var(--hilite-text);}
.song-row-text p{margin:0;font-size:9.5px;color:var(--dim-text-2);font-family:"Courier New",monospace;}
.song-row-play{font-size:10px;color:var(--dim-text-2);flex-shrink:0;}
.song-row.active .song-row-play{color:var(--hilite-text);}

.display-body{position:relative;z-index:4;padding:16px 18px;flex:1;overflow-y:auto;transition:opacity .16s ease;}
.display-body::-webkit-scrollbar{width:6px;}
.display-body::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);}
.display-body::-webkit-scrollbar-track{background:transparent;}

.display-image{width:100%;height:170px;margin-bottom:12px;box-shadow:0 8px 20px var(--shadow-1);display:block;border-radius:6px;background-size:cover;background-position:center;}
.display-desc{font-size:12px;line-height:1.7;color:var(--dim-text);font-family:"Courier New",monospace;}
.display-meta{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line-dashed);font-size:10px;color:var(--dim-text-2);font-family:"Courier New",monospace;letter-spacing:0.5px;}
.display-meta div{margin-bottom:4px;}

.media-image{width:100%;max-width:420px;height:240px;margin:4px auto 14px auto;box-shadow:0 14px 34px var(--shadow-1);display:block;border-radius:8px;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:rgba(0,0,0,0.35);}

.media-image-wrap{position:relative;max-width:420px;margin:0 auto;}
.media-image-wrap .media-image{margin:4px auto 14px auto;}
.img-focus-btn{
  position:absolute;bottom:24px;right:10px;z-index:6;
  max-width:calc(100% - 20px);
  padding:7px 14px 7px 11px;border-radius:20px;
  display:flex;align-items:center;gap:6px;
  background:rgba(17,17,20,0.55);backdrop-filter:blur(6px);
  box-shadow:0 6px 16px var(--shadow-2), inset 0 0 0 1px var(--glass-highlight);
  color:var(--hilite-text);font-family:"Trebuchet MS",sans-serif;
  font-size:11px;letter-spacing:0.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.img-focus-btn:hover{opacity:0.85;}
.img-focus-btn svg{flex-shrink:0;}

#waveStage{ transition:filter .4s ease; }

.wave-canvas-layer.pannable{
  background-size:145% !important;
  cursor:grab;
  transition:background-position .05s linear;
  touch-action:none;
}
.wave-canvas-layer.pannable.panning{ cursor:grabbing; transition:none; }

body.is-panning-drag,
body.is-panning-drag *{
  user-select:none !important;
  -webkit-user-select:none !important;
  cursor:grabbing !important;
}

.focus-hint{
  position:fixed;left:50%;top:22px;transform:translate(-50%,-10px);
  z-index:50;padding:9px 18px;border-radius:20px;
  background:rgba(17,17,20,0.62);backdrop-filter:blur(8px);
  color:var(--hilite-text);font-family:"Trebuchet MS",sans-serif;
  font-size:12px;letter-spacing:0.3px;text-align:center;
  display:flex;align-items:center;gap:7px;
  box-shadow:0 8px 22px var(--shadow-1), inset 0 0 0 1px var(--glass-highlight);
  opacity:0;pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
}
.focus-hint svg{flex-shrink:0;opacity:0.85;}
.focus-hint.show{ opacity:1; transform:translate(-50%,0); }

.pdf-viewport{
  position:relative;width:100%;min-height:440px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:6px 0 14px 0;border-radius:8px;overflow:hidden;
  background:var(--panel-bg-soft);
  box-shadow:inset 0 0 0 1px var(--glass-highlight);
}
.pdf-canvas-wrap{
  position:relative;width:100%;flex:1;min-height:440px;
  display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;padding:14px 0;
}
.pdf-canvas-wrap canvas{
  max-width:92%;
  box-shadow:0 14px 34px var(--shadow-1);border-radius:4px;
  background:#fff;
}
.pdf-empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:40px 20px;text-align:center;color:var(--dim-text);
  font-family:"Courier New",monospace;font-size:11.5px;line-height:1.7;
}
.pdf-empty-state svg{opacity:0.4;stroke:var(--icon-stroke);}
.pdf-upload-btn{
  padding:9px 20px;border-radius:20px;border:none;cursor:pointer;
  background:var(--panel-bg-strong);color:var(--hilite-text);
  font-family:"Trebuchet MS",sans-serif;font-size:11.5px;letter-spacing:0.4px;
  box-shadow:0 6px 16px var(--shadow-2), inset 0 0 0 1px var(--glass-highlight);
  transition:all .2s ease;
}
.pdf-upload-btn:hover{transform:scale(1.04);}
.pdf-loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:40px 20px;color:var(--dim-text-2);font-family:"Courier New",monospace;font-size:11px;
}
.book-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px;}
.book-nav button{
  width:26px;height:26px;color:var(--hilite-text);font-size:15px;
  border:none;background:transparent;cursor:pointer;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,0.6));
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.book-nav button:hover{opacity:0.68;}
.book-nav button:disabled{opacity:0.35;cursor:default;transform:none;}
.book-nav span{font-size:9.5px;letter-spacing:1.5px;color:var(--dim-text-2);font-family:"Courier New",monospace;text-transform:uppercase;}
.display-meta span{color:var(--hilite-text);}

.favorites-empty{color:var(--dim-text-2);font-size:11px;line-height:1.7;font-family:"Courier New",monospace;padding:20px 4px;text-align:center;}
.favorites-list{display:flex;flex-direction:column;gap:8px;}
.favorites-list .list-item{background:var(--panel-bg-soft);}
.fav-cat-tag{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim-text-2);}

.right-col{position:relative;width:320px;min-height:760px;display:flex;flex-direction:column;padding:20px 16px;}
.mobile-fav-btn{ display:none; }

.brand-plate{text-align:center;padding:6px 0 18px 0;border-bottom:1px solid var(--line-soft);margin-bottom:16px;}
.mobile-step3-title{ display:none; }
.title-row{display:flex;align-items:baseline;justify-content:center;gap:3px;flex-wrap:nowrap;cursor:pointer;user-select:none;transition:opacity .15s ease;}
.title-row:hover{opacity:0.75;}
.title-row:active{opacity:0.55;}
.title-row .t-online{font-family:"Trebuchet MS",sans-serif;font-weight:300;font-size:22px;color:var(--dim-text);letter-spacing:0.5px;transition:all .5s ease;}
.title-row .t-cathedral{font-family:"Trebuchet MS",sans-serif;font-weight:700;font-size:22px;letter-spacing:0.5px;color:var(--hilite-text);transition:all .5s ease;}

@keyframes titleFlow{
  0%{ background-position:0% 50%; }
  100%{ background-position:300% 50%; }
}
.rainbow-text{
  background:linear-gradient(90deg,#ff8a8a,#ffd28a,#9ee79e,#8ac4ff,#c99bff,#ff8a8a);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation: titleFlow 6s linear infinite;
}
.title-row.colorized .t-online{background:linear-gradient(90deg,#ff8a8a,#ffd28a,#9ee79e,#8ac4ff,#c99bff,#ff8a8a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleFlow 6s linear infinite;}
.title-row.colorized .t-cathedral{background:linear-gradient(90deg,#ff8a8a,#ffd28a,#9ee79e,#8ac4ff,#c99bff,#ff8a8a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleFlow 6s linear infinite;}

.section-label{font-size:9px;letter-spacing:3px;color:var(--dim-text-2);text-transform:uppercase;padding:0 2px 8px 2px;text-align:left;font-weight:600;}
.section-label.rainbow-text{font-weight:700;}

.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.content-cell{
  position:relative;border-radius:8px;overflow:hidden;height:64px;cursor:pointer;
  background:var(--panel-bg-med);
  box-shadow:0 6px 18px var(--shadow-2);
  transition:box-shadow .25s ease;
}
.content-cell:hover{box-shadow:0 8px 22px var(--shadow-med);}
.content-cell.active{box-shadow:0 12px 28px var(--shadow-lift);}
.content-cell canvas{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(0);}
.content-cell-label{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  padding:4px 6px 5px 6px;font-size:9.5px;letter-spacing:1.5px;text-align:center;
  color:var(--hilite-text);text-transform:uppercase;font-weight:600;
  background:linear-gradient(0deg, var(--panel-bg-strong), transparent);
  transition:color .3s ease;
}
.content-cell.active .content-cell-label{font-weight:700;}

.content-image-space{height:34px;margin-bottom:10px;}

.mini-screen-wrap{margin-bottom:14px;}
.mini-screen{
  position:relative;height:70px;border-radius:8px;overflow:hidden;
  background:var(--panel-bg-med);
  box-shadow:0 8px 20px var(--shadow-2);
}
.mini-screen canvas{position:absolute;inset:0;width:100%;height:100%;}
.mini-live-tag{position:absolute;top:6px;left:8px;z-index:5;display:flex;align-items:center;gap:4px;font-size:8px;letter-spacing:1.5px;color:var(--dim-text);font-family:"Courier New",monospace;text-transform:uppercase;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--hilite-text);box-shadow:0 0 6px var(--shadow-lift), 0 0 3px var(--hilite-text);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.35;transform:scale(0.8);}}
.mini-clock-tag{position:absolute;top:6px;right:8px;z-index:5;font-size:9px;letter-spacing:1px;color:var(--dim-text);font-family:"Courier New",monospace;}

.list-panel-outer{position:relative;border-radius:8px;height:280px;display:flex;flex-direction:column;flex-shrink:0;}
.list-panel-titlebar{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px 2px;font-size:9px;letter-spacing:1px;}

.back-arrow{
  color:var(--dim-text);cursor:pointer;line-height:1;user-select:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:opacity .2s ease;
}
.back-arrow:hover{ opacity:0.7; }
.list-panel-titlebar .cat-name{color:var(--dim-text-2);letter-spacing:2px;text-transform:uppercase;font-weight:600;transition:all .5s ease;}
.list-panel-titlebar .cat-name.colorized{
  background:linear-gradient(90deg,#ff8a8a,#ffd28a,#9ee79e,#8ac4ff,#c99bff,#ff8a8a);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation: titleFlow 6s linear infinite;
}

.search-bar{
  display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:7px 12px;border-radius:20px;
  flex-shrink:0;
}
.search-bar svg{flex-shrink:0;opacity:0.5;stroke:var(--icon-stroke);}
.search-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--hilite-text);font-family:"Trebuchet MS",sans-serif;font-size:11.5px;letter-spacing:0.3px;}
.search-bar input::placeholder{color:var(--dim-text-2);}

.list-scroll-wrap{
  position:relative;display:flex;border-radius:8px;overflow:hidden;
  background:var(--panel-bg-soft);
  flex:1 1 0;
  min-height:0;
  height:100%;
}
.rot-label{writing-mode:vertical-rl;transform:rotate(180deg);width:22px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:2px;color:var(--dim-text-2);border-right:1px solid var(--line-soft);text-transform:uppercase;font-weight:bold;padding:8px 0;flex-shrink:0;transition:color .3s ease;}
.rot-label.colorized{
  background:linear-gradient(180deg,#ff8a8a,#ffd28a,#9ee79e,#8ac4ff,#c99bff,#ff8a8a);
  background-size:100% 300%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation: rotFlow 6s linear infinite;
}
@keyframes rotFlow{ 0%{background-position:50% 0%;} 100%{background-position:50% 300%;} }

.list-items{
  flex:1 1 0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:0;
  height:100%;
}
.list-items::-webkit-scrollbar{width:6px;}
.list-items::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);}
.list-items::-webkit-scrollbar-track{background:transparent;}

.list-item{
  position:relative;
  display:flex;gap:8px;padding:7px;border-radius:6px;cursor:pointer;
  box-shadow:inset 0 0 0 1px transparent;
  transition:all .15s ease;
  flex-shrink:0;
  content-visibility:auto;
  contain-intrinsic-size:60px;
}
.list-item:hover{box-shadow:inset 0 0 0 1px var(--glass-highlight-2);}
.list-item-thumb{width:44px;height:44px;flex-shrink:0;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:rgba(0,0,0,0.35);border-radius:4px;position:relative;overflow:hidden;}

@keyframes thumbShimmer{ 0%{ background-position:-120% 0; } 100%{ background-position:220% 0; } }
.thumb-loading::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.10) 50%, transparent 70%);
  background-size:200% 100%;
  animation:thumbShimmer 1.3s ease-in-out infinite;
}
.thumb-broken{ background:linear-gradient(135deg,#2a2a2e,#1c1c1f) !important; }
.thumb-broken::before{
  content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;

<script>
function ink(alpha){ return `rgba(236,234,228,${alpha})`; }

const waveLayerA = document.getElementById('waveLayerA');
const waveLayerB = document.getElementById('waveLayerB');
const BG_IMAGES = {
  default: 'images/background-1.jpg',
  bible: 'images/background-2.jpg',
  books: 'images/background-3.jpg',
  images: 'images/background-4.jpg',
  symphonies: 'images/background-5.jpg'
};

const bgImageCache = {};
function preloadBackgrounds(){
  Object.entries(BG_IMAGES).forEach(([key, url])=>{
    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    bgImageCache[key] = img;
  });
}
preloadBackgrounds();

const bgLayers = {
  A: { el: waveLayerA, cat: 'default' },
  B: { el: waveLayerB, cat: null }
};
let activeBgLayer = 'A';
bgLayers.A.el.style.backgroundImage = `url('${BG_IMAGES.default}')`;

let bgTransitionTimer = null;

function switchBackgroundToUrl(url, key){
  const current = bgLayers[activeBgLayer];
  if(current.cat === key) return;
  const targetKey = activeBgLayer === 'A' ? 'B' : 'A';
  const target = bgLayers[targetKey];

  target.cat = key;
  target.el.style.backgroundImage = `url('${url}')`;

  activeBgLayer = targetKey;

  if(bgTransitionTimer) clearTimeout(bgTransitionTimer);
  current.el.classList.remove('bg-transitioning');
  target.el.classList.remove('bg-transitioning');
  void target.el.offsetWidth;
  current.el.classList.add('bg-transitioning');
  target.el.classList.add('bg-transitioning');

  target.el.style.opacity = '1';
  current.el.style.opacity = '0';

  bgTransitionTimer = setTimeout(()=>{
    current.el.classList.remove('bg-transitioning');
    target.el.classList.remove('bg-transitioning');
  }, 1150);
}

function switchBackground(cat){
  switchBackgroundToUrl(BG_IMAGES[cat] || BG_IMAGES.default, cat);
}

let focusModeActive = false;
let focusModeHintTimer = null;

let panPosX = 50, panPosY = 50;
let panDragging = false;
let panStartX = 0, panStartY = 0;
let panStartPosX = 50, panStartPosY = 50;

function currentBgLayerEl(){
  return bgLayers[activeBgLayer].el;
}

function resetPanPosition(el){
  panPosX = 50; panPosY = 50;
  if(el) el.style.backgroundPosition = '50% 50%';
}

function enablePanning(){
  const el = currentBgLayerEl();
  el.classList.add('pannable');
  resetPanPosition(el);
}

function disablePanning(){
  document.querySelectorAll('.wave-canvas-layer').forEach(el=>{
    el.classList.remove('pannable', 'panning');
    el.style.backgroundPosition = '';
  });
}

const PAN_DRAG_THRESHOLD = 6; // px
let panArmed = false;
let panMoved = false;

function suppressNextClickOnce(){
  const killClick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); };
  document.addEventListener('click', killClick, { capture:true, once:true });
  setTimeout(()=> document.removeEventListener('click', killClick, { capture:true }), 500);
}

// Dragging the background pan across the page was able to land on/over
// the search input and leave it focused (native browser focus-on-pointerdown
// happens before our own drag-threshold logic runs), which showed the
// focus outline even though the user never meant to interact with the
// field. Blur any input the instant a real drag is confirmed, and again
// on pointer-up as a fallback for drags that started on the input itself.
function blurStrayInputFocus(){
  const active = document.activeElement;
  if(active && active.tagName === 'INPUT'){
    active.blur();
  }
}

function onPanPointerDown(e){
  if(!focusModeActive) return;
  const el = currentBgLayerEl();
  if(!el.classList.contains('pannable')) return;
  if(e.button !== undefined && e.button !== 0) return;
  panArmed = true;
  panMoved = false;
  panStartX = e.clientX; panStartY = e.clientY;
  panStartPosX = panPosX; panStartPosY = panPosY;
}
function onPanPointerMove(e){
  if(!panArmed) return;
  const dxRaw = e.clientX - panStartX;
  const dyRaw = e.clientY - panStartY;
  if(!panMoved){
    if(Math.hypot(dxRaw, dyRaw) < PAN_DRAG_THRESHOLD) return;
    panMoved = true;
    panDragging = true;
    document.body.classList.add('is-panning-drag');
    currentBgLayerEl().classList.add('panning');
    blurStrayInputFocus();
  }
  const el = currentBgLayerEl();
  const rect = el.getBoundingClientRect();
  const rangeX = rect.width * 0.45 || 1;
  const rangeY = rect.height * 0.45 || 1;
  const dx = dxRaw / rangeX * 100;
  const dy = dyRaw / rangeY * 100;
  panPosX = Math.max(0, Math.min(100, panStartPosX - dx));
  panPosY = Math.max(0, Math.min(100, panStartPosY - dy));
  el.style.backgroundPosition = `${panPosX}% ${panPosY}%`;
}

function setupParticles(canvas, count, linkDist){
  const ctx = canvas.getContext('2d');
  let cw, ch;
  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    cw = canvas.width = rect.width;
    ch = canvas.height = rect.height;
  }
  resize();
  window.addEventListener('resize', resize);
  const pts = [];
  for(let i=0;i<count;i++){
    pts.push({x:Math.random()*cw, y:Math.random()*ch, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, r:Math.random()*1.1+0.6});
  }
  function draw(){
    requestAnimationFrame(draw);
    if(!pageVisible) return;
    ctx.clearRect(0,0,cw,ch);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>cw) p.vx*=-1;
      if(p.y<0||p.y>ch) p.vy*=-1;
    });
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const a=pts[i], b=pts[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<linkDist){
          ctx.strokeStyle = ink((0.28*(1-dist/linkDist)));
          ctx.lineWidth=0.6;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    pts.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = ink(0.55);
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 3;
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }
  draw();
}

function effectParticlesRise(canvas, getColored){
  const ctx = canvas.getContext('2d');
  let cw,ch;
  function resize(){ const r=canvas.getBoundingClientRect(); cw=canvas.width=r.width; ch=canvas.height=r.height; }
  resize(); window.addEventListener('resize', resize);
  const pts = [];
  for(let i=0;i<16;i++) pts.push({x:Math.random()*cw,y:Math.random()*ch,vy:-(Math.random()*0.15+0.05),r:Math.random()*1+0.5,tw:Math.random()*Math.PI*2, hue:Math.random()*360});
  function draw(){
    requestAnimationFrame(draw);
    if(!pageVisible) return;
    ctx.clearRect(0,0,cw,ch);
    const colored = getColored();
    pts.forEach(p=>{
      p.y += p.vy; p.tw += 0.05;
      if(p.y<-4) p.y = ch+4;
      const alpha = 0.4 + Math.sin(p.tw)*0.3;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      if(colored){
        p.hue = (p.hue + 0.4) % 360;
        ctx.fillStyle = `hsla(${p.hue},70%,55%,${Math.max(0.25,alpha)})`;
        ctx.shadowColor = `hsla(${p.hue},80%,65%,0.8)`;
      } else {
        ctx.fillStyle = ink(Math.max(0.12,alpha));
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
      }
      ctx.shadowBlur = 4;
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }
  draw();
}

function effectBookSpines(canvas, getColored){
  const ctx = canvas.getContext('2d');
  let cw,ch;
  function resize(){ const r=canvas.getBoundingClientRect(); cw=canvas.width=r.width; ch=canvas.height=r.height; }
  resize(); window.addEventListener('resize', resize);
  const n = 9;
  const spines = [];
  for(let i=0;i<n;i++){
    spines.push({ phase: Math.random()*Math.PI*2, speed: 0.02+Math.random()*0.02, hue: (i/n)*360 });
  }
  function draw(){
    requestAnimationFrame(draw);
    if(!pageVisible) return;
    ctx.clearRect(0,0,cw,ch);
    const colored = getColored();
    const spineW = cw/n;
    spines.forEach((s,i)=>{
      s.phase += s.speed;
      const lift = Math.sin(s.phase) * (ch*0.18);
      const topY = ch*0.22 - Math.max(0,lift);
      const x = i*spineW + spineW*0.15;
      const w = spineW*0.7;
      const hgt = ch - topY - 4;
      if(colored){
        s.hue = (s.hue + 0.3) % 360;
        ctx.fillStyle = `hsla(${s.hue},65%,55%,0.55)`;
      } else {
        ctx.fillStyle = ink(0.22);
      }
      ctx.fillRect(x, topY, w, hgt);
    });
  }
  draw();
}

function effectGradientBlobs(canvas, getColored){
  const ctx = canvas.getContext('2d');
  let cw,ch;
  function resize(){ const r=canvas.getBoundingClientRect(); cw=canvas.width=r.width; ch=canvas.height=r.height; }
  resize(); window.addEventListener('resize', resize);
  let tt = 0;
  const hues = [10, 140, 220];
  function draw(){
    requestAnimationFrame(draw);
    if(!pageVisible) return;
    ctx.clearRect(0,0,cw,ch);
    const colored = getColored();
    for(let i=0;i<3;i++){
      const bx = cw/2 + Math.sin(tt*0.02 + i*2)*cw*0.32;
      const by = ch/2 + Math.cos(tt*0.025 + i*2.4)*ch*0.32;
      const grad = ctx.createRadialGradient(bx,by,0,bx,by,26);
      if(colored){
        hues[i] = (hues[i] + 0.5) % 360;
        grad.addColorStop(0, `hsla(${hues[i]},70%,60%,0.5)`);
        grad.addColorStop(1, `hsla(${hues[i]},70%,60%,0)`);
      } else {
        grad.addColorStop(0, ink(0.22));
        grad.addColorStop(1, ink(0));
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx,by,26,0,Math.PI*2);
      ctx.fill();
    }
    tt += 1;
  }
  draw();
}

function effectWaveformBars(canvas, getColored){
  const ctx = canvas.getContext('2d');
  let cw,ch;
  function resize(){ const r=canvas.getBoundingClientRect(); cw=canvas.width=r.width; ch=canvas.height=r.height; }
  resize(); window.addEventListener('resize', resize);
  const bars = 20;
  let tt = 0;
  function draw(){
    requestAnimationFrame(draw);
    if(!pageVisible) return;
    ctx.clearRect(0,0,cw,ch);
    const colored = getColored();
    const bw = cw/bars;
    for(let i=0;i<bars;i++){
      const hgt = (Math.sin(tt*0.08 + i*0.7) * 0.5 + 0.5) * (ch*0.7) + ch*0.08;
      if(colored){
        const hue = (i/bars)*300 + tt*0.5;
        ctx.fillStyle = `hsla(${hue%360},70%,55%,0.55)`;
      } else {
        ctx.fillStyle = ink(0.28);
      }
      ctx.fillRect(i*bw+1, ch-hgt, bw-2, hgt);
    }
    tt += 1;
  }
  draw();
}

const IMAGES_MANIFEST_CANDIDATES = ['imagesjson', 'imagesjson.json', 'images.json', 'manifest.json'];
let imagesManifestLoaded = false;
let imagesManifestLoading = null;
let imagesManifestError = null;

async function tryFetchManifest(url){
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error(`${url} -> HTTP ${res.status}`);
  const text = await res.text();
  return JSON.parse(text);
}

async function loadImagesManifest(){
  if(imagesManifestLoaded) return;
  if(imagesManifestLoading) return imagesManifestLoading;
  imagesManifestLoading = (async () => {
    let raw = null;
    const attempts = [];
    for(const name of IMAGES_MANIFEST_CANDIDATES){
      const url = PATHS.images + name;
      try{
        raw = await tryFetchManifest(url);
        break;
      } catch(err){
        attempts.push({ url, message: err.message });
      }
    }
    if(raw && Array.isArray(raw)){
      DATA.images = raw.map(entry => ({
        title: entry.title || '',
        artist: entry.artist || '',
        year: entry.year || '',
        file: entry.file || '',
        short: entry.short || '',
        tech: entry.type || entry.tech || ''
      }));
      imagesManifestError = null;
    } else {
      console.warn('Could not load images manifest. Tried:', attempts);
      imagesManifestError = attempts.length
        ? `Tried ${attempts.length} filenames in ${PATHS.images} — all failed (e.g. ${attempts[attempts.length-1].message})`
        : 'Manifest was not a JSON array';
      DATA.images = [];
    }
    imagesManifestLoaded = true;
    if(currentCat === 'images') renderList('images');
  })();
  return imagesManifestLoading;
}

async function renderPdfPage(key, pageNum){

  const wrap = document.getElementById('pdfCanvasWrap');
  const targetWidth = Math.min(wrap ? wrap.clientWidth * 0.92 : 380, 700);
  const baseViewport = page.getViewport({ scale: 1 });
  const scale = targetWidth / baseViewport.width;
  const viewport = page.getViewport({ scale });
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;
}

function refreshPdfNav(key){
  const doc = pdfDocsByKey[key];
  const indicator = document.getElementById('bookPageIndicator');
  const prevBtn = document.getElementById('bookPrev');
  const nextBtn = document.getElementById('bookNext');
  if(!doc){
    if(indicator) indicator.textContent = 'No PDF';
    if(prevBtn) prevBtn.disabled = true;
    if(nextBtn) nextBtn.disabled = true;
    return;
  }
  const page = pdfPageByKey[key];
  if(indicator) indicator.textContent = `Page ${page} / ${doc.numPages}`;
  if(prevBtn) prevBtn.disabled = page <= 1;
  if(nextBtn) nextBtn.disabled = page >= doc.numPages;
}

const pdfAutoFetchAttempted = new Set();

async function loadPdfFromArrayBuffer(key, arrayBuffer){
  const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
  const doc = await loadingTask.promise;
  pdfDocsByKey[key] = doc;
  pdfPageByKey[key] = 1;
  if(pdfViewerKey === key){
    rebuildPdfViewportMarkup(key);
    await renderPdfPage(key, 1);
    refreshPdfNav(key);
  }
}

async function autoFetchPdf(cat, item, key){
  if(pdfAutoFetchAttempted.has(key) || pdfDocsByKey[key]) return;
  pdfAutoFetchAttempted.add(key);
  const url = PATHS[cat] + (item.file || (slugify(item.title) + '.pdf'));
  try{
    const res = await fetch(url);
    if(!res.ok) return;
    const buf = await res.arrayBuffer();
    await loadPdfFromArrayBuffer(key, buf);
  } catch(err){ }
}

async function loadPdfForKey(key, file){
  const viewport = document.getElementById('pdfViewport');
  if(viewport){
    viewport.innerHTML = `<div class="pdf-loading-state">Loading PDF…</div>`;
  }
  try{
    const arrayBuffer = await file.arrayBuffer();
    await loadPdfFromArrayBuffer(key, arrayBuffer);
  } catch(err){
    if(viewport){
      viewport.innerHTML = `<div class="pdf-empty-state">Could not read that PDF. Please try another file.<br><button class="pdf-upload-btn" id="pdfUploadBtnRetry">Upload PDF</button></div>`;
      const retry = document.getElementById('pdfUploadBtnRetry');
      if(retry) retry.addEventListener('click', ()=> document.getElementById('pdfFileInput').click());
    }
  }
}

function rebuildPdfViewportMarkup(key){
  const viewport = document.getElementById('pdfViewport');
  if(!viewport) return;
  const hasDoc = !!pdfDocsByKey[key];
  viewport.innerHTML = hasDoc
    ? `<div class="pdf-canvas-wrap" id="pdfCanvasWrap"><canvas id="pdfCanvas"></canvas></div>`
    : `<div class="pdf-empty-state" id="pdfEmptyState">
         <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
         <div>No PDF loaded yet for this entry.<br>Upload one to start reading.</div>
         <button class="pdf-upload-btn" id="pdfUploadBtn">Upload PDF</button>
       </div>`;
  wirePdfUploadButton();
}

function wirePdfUploadButton(){
  const btn = document.getElementById('pdfUploadBtn');
  if(btn) btn.addEventListener('click', ()=> document.getElementById('pdfFileInput').click());
  const replaceBtn = document.getElementById('pdfReplaceBtn');
  if(replaceBtn) replaceBtn.addEventListener('click', ()=> document.getElementById('pdfFileInput').click());
}

function initPdfViewer(key, cat, item){
  pdfViewerKey = key;
  wirePdfUploadButton();

  const fileInput = document.getElementById('pdfFileInput');
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(file) loadPdfForKey(key, file);
    fileInput.value = '';
  });

  document.getElementById('bookPrev').addEventListener('click', ()=>{
    const doc = pdfDocsByKey[key];
    if(!doc) return;
    if(pdfPageByKey[key] > 1){
      pdfPageByKey[key]--;
      renderPdfPage(key, pdfPageByKey[key]);
      refreshPdfNav(key);
    }
  });
  document.getElementById('bookNext').addEventListener('click', ()=>{
    const doc = pdfDocsByKey[key];
    if(!doc) return;
    if(pdfPageByKey[key] < doc.numPages){
      pdfPageByKey[key]++;
      renderPdfPage(key, pdfPageByKey[key]);
      refreshPdfNav(key);
    }
  });

  if(pdfDocsByKey[key]){
    renderPdfPage(key, pdfPageByKey[key]);
  } else if(cat && item){
    autoFetchPdf(cat, item, key);
  }
}

function selectItem(item, el){
  document.querySelectorAll('.list-item').forEach(e=>e.classList.remove('active'));
  if(el) el.classList.add('active');

  const dispTitle = document.getElementById('dispTitle');
  const dispSub = document.getElementById('dispSubtitle');
  document.getElementById('dispBackArrow').style.display = 'none';

  if(currentCat === 'bible'){
    if(focusModeActive) exitImageFocusMode();
    dispTitle.textContent = item.book;
    dispSub.textContent = item.chapterLabel;
    dispSub.style.display = 'block';
    const key = pdfKeyFor('bible', item.title, item.file);
    setDispBody(pdfViewerHTML(key, false), ()=>initPdfViewer(key, 'bible', item));
  } else if(currentCat === 'books'){
    if(focusModeActive) exitImageFocusMode();
    dispTitle.textContent = item.title;
    dispSub.textContent = item.author;
    dispSub.style.display = 'block';
    const key = pdfKeyFor('books', item.title, item.file);
    setDispBody(pdfViewerHTML(key, true, item.tech, item.year), ()=>initPdfViewer(key, 'books', item));
  } else if(currentCat === 'images'){
    dispTitle.textContent = item.title;
    dispSub.textContent = item.artist;
    dispSub.style.display = 'block';
    const rawUrl = rawImageUrlFor('images', item);
    setDispBody(mediaDisplayHTML(thumbFor('images', item), item.year, item.tech, rawUrl), ()=>{
      const btn = document.getElementById('imgFocusBtn');
      if(btn) btn.addEventListener('click', ()=> enterImageFocusMode(rawUrl));
      const mediaEl = document.getElementById('mediaImageEl');
      if(mediaEl && rawUrl){
        checkImageAvailable(rawUrl).then(ok=>{
          if(!document.body.contains(mediaEl)) return;
          mediaEl.classList.remove('thumb-loading');
          if(!ok){
            mediaEl.classList.add('thumb-broken');
            if(btn) btn.style.display = 'none';
            return;
          }
          enterImageFocusMode(rawUrl);
        });
      } else if(mediaEl){
        mediaEl.classList.remove('thumb-loading');
      }
    });
  } else if(currentCat === 'symphonies'){
    if(focusModeActive) exitImageFocusMode();
    document.getElementById('favToggleBtn').classList.remove('active');
    document.getElementById('mobileFavBtn').classList.remove('active');
    showingFavorites = false;
    renderArtistBrowse(item.title);
  }

  if(document.body.classList.contains('is-mobile')) goToStep(3);
}

  favToggleBtn.classList.remove('active');

function renderFavoritesView(){
  document.getElementById('dispTitle').textContent = 'Favorites';
  document.getElementById('dispSubtitle').style.display = 'none';
  document.getElementById('dispBackArrow').style.display = 'none';
  if(favorites.size === 0){
    setDispBody(`<div class="favorites-empty">No favorites yet.<br>Tap the star on any item, album, or song to save it here.</div>`);
    return;
  }
  let html = '<div class="favorites-list">';
  favorites.forEach(key=>{
    const idx = key.indexOf('|');
    const cat = key.slice(0, idx);
    const rest = key.slice(idx+1);

    if(cat === 'song'){
      const [artistTitle, albumTitle, songTitle] = rest.split('::');
      const artist = findArtist(artistTitle);
      const album = findAlbum(artistTitle, albumTitle);
      const song = album && album.songs.find(s=>s.title===songTitle);
      if(!artist || !album || !song) return;
      html += `
        <div class="list-item fav-view-item" data-kind="song" data-artist="${artistTitle.replace(/"/g,'&quot;')}" data-album="${albumTitle.replace(/"/g,'&quot;')}" data-song="${songTitle.replace(/"/g,'&quot;')}">
          <div class="list-item-thumb" style="background-image:${albumCoverFor(artist, album)}"></div>
          <div class="list-item-text">
            <h4>${song.title}</h4>
            <p>${artistTitle} · ${albumTitle}</p>
            <span class="fav-cat-tag">song ▸</span>
          </div>
        </div>`;
    } else if(cat === 'album'){
      const [artistTitle, albumTitle] = rest.split('::');
      const artist = findArtist(artistTitle);
      const album = findAlbum(artistTitle, albumTitle);
      if(!artist || !album) return;
      html += `
        <div class="list-item fav-view-item" data-kind="album" data-artist="${artistTitle.replace(/"/g,'&quot;')}" data-album="${albumTitle.replace(/"/g,'&quot;')}">
          <div class="list-item-thumb" style="background-image:${albumCoverFor(artist, album)}"></div>
          <div class="list-item-text">
            <h4>${album.title}</h4>
            <p>${artistTitle} · ${album.year}</p>
            <span class="fav-cat-tag">album ▸</span>
          </div>
        </div>`;
    } else {
      const item = (DATA[cat] || []).find(it => it.title === rest);
      if(!item) return;
      html += `
        <div class="list-item fav-view-item" data-kind="content" data-cat="${cat}" data-title="${rest.replace(/"/g,'&quot;')}">
          <div class="list-item-thumb" style="background-image:${thumbFor(cat,item)}"></div>
          <div class="list-item-text">
            <h4>${item.title}</h4>
            <p>${item.short||''}</p>
            <span class="fav-cat-tag">${cat} ▸</span>
          </div>
        </div>`;
    }
  });
  html += '</div>';
  setDispBody(html, wireFavoritesView);
}

function wireFavoritesView(){
  document.querySelectorAll('#dispBody .fav-view-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kind = el.dataset.kind;
      exitFavoritesView();
      if(kind === 'song'){
        const artistTitle = el.dataset.artist, albumTitle = el.dataset.album, songTitle = el.dataset.song;
        const album = findAlbum(artistTitle, albumTitle);
        const idx = album ? album.songs.findIndex(s=>s.title===songTitle) : -1;
        currentCat = 'symphonies';
        playbackContext = { mode:'favSongs' };
        selectCategory('symphonies');
        renderAlbumBrowse(artistTitle, albumTitle);
        if(idx > -1){
          const queue = currentQueue();
          const qIdx = queue.findIndex(q=>q.artistTitle===artistTitle && q.albumTitle===albumTitle && q.title===songTitle);
          loadIndexPreservingState(qIdx > -1 ? qIdx : 0, true);
        }
      } else if(kind === 'album'){
        const artistTitle = el.dataset.artist, albumTitle = el.dataset.album;
        currentCat = 'symphonies';
        selectCategory('symphonies');
        playbackContext = { mode:'favAlbum', artistTitle, albumTitle };
        renderAlbumBrowse(artistTitle, albumTitle);
      } else {
        const cat = el.dataset.cat, title = el.dataset.title;
        const item = (DATA[cat] || []).find(it => it.title === title);
        selectCategory(cat);
        if(item) selectItem(item, null);
        setTimeout(()=>{
          document.querySelectorAll('#listItems .list-item').forEach(li=>{
            const h4 = li.querySelector('h4');
            if(h4 && h4.textContent === title) li.classList.add('active');
          });
        }, 30);
      }
    });
  });
}

let playbackContext = { mode:'album', artistTitle: null, albumTitle: null };
let audioIndex = 0, audioPlaying = false;
let trackLoaded = false;
const audioEl = new Audio();
audioEl.preload = 'metadata';

function formatTime(s){
  s = Math.max(0, Math.floor(s||0));
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function currentQueue(){
  if(playbackContext.mode === 'favSongs'){
    const out = [];
    favorites.forEach(key=>{
      const idx = key.indexOf('|');
      const cat = key.slice(0, idx);
      if(cat !== 'song') return;
      const rest = key.slice(idx+1);
      const [artistTitle, albumTitle, songTitle] = rest.split('::');
      const artist = findArtist(artistTitle);
      const album = findAlbum(artistTitle, albumTitle);
      if(!artist || !album) return;
      const song = album.songs.find(s=>s.title===songTitle);
      if(!song) return;
      out.push({ title: song.title, duration: song.duration, artistTitle, albumTitle, cover: albumCoverFor(artist, album), src: songSrcFor(artist, album, song) });
    });
    return out;
  }
  const artist = findArtist(playbackContext.artistTitle);
  const album = findAlbum(playbackContext.artistTitle, playbackContext.albumTitle);
  if(!artist || !album) return [];
  return album.songs.map(s => ({ title: s.title, duration: s.duration, artistTitle: artist.title, albumTitle: album.title, cover: albumCoverFor(artist, album), src: songSrcFor(artist, album, s) }));
}

function songFavKey(artistTitle, albumTitle, songTitle){
  return 'song|' + artistTitle + '::' + albumTitle + '::' + songTitle;
}

function loadTrack(i, autoplay){
  const queue = currentQueue();
  if(queue.length === 0) return;
  trackLoaded = true;
  audioIndex = Math.max(0, Math.min(i, queue.length - 1));
  const tr = queue[audioIndex];
  document.getElementById('audioArt').style.background = tr.cover || 'linear-gradient(135deg,#e8e8ea,#c8c8cc)';
  document.getElementById('audioTitle').textContent = tr.title;
  document.getElementById('audioArtist').textContent = tr.artistTitle + ' · ' + tr.albumTitle;
  const seek = document.getElementById('audioSeek');
  seek.max = tr.duration || 0;
  seek.value = 0;
  document.getElementById('audioDurTime').textContent = formatTime(tr.duration);
  document.getElementById('audioCurTime').textContent = '0:00';
  updateAudioFavStar();
  updatePrevNextEnabled();
  audioEl.src = tr.src;
  if(autoplay){
    audioEl.play().catch(()=>{ audioPlaying = false; audioPlayIcon.innerHTML = PLAY_PATH; });
    audioPlaying = true;
    audioPlayIcon.innerHTML = PAUSE_PATH;
  }
}

function updatePrevNextEnabled(){
  const queue = currentQueue();
  document.getElementById('audioPrev').disabled = audioIndex <= 0;
  document.getElementById('audioNext').disabled = audioIndex >= queue.length - 1;
}

function updateAudioFavStar(){
  const queue = currentQueue();
  const tr = queue[audioIndex];
  if(!tr) return;
  const btn = document.getElementById('audioFavStar');
  btn.dataset.songKey = songFavKey(tr.artistTitle, tr.albumTitle, tr.title);
  btn.classList.toggle('active', favorites.has(btn.dataset.songKey));
}

document.getElementById('audioFavStar').addEventListener('click', ()=>{
  const key = document.getElementById('audioFavStar').dataset.songKey;
  if(!key) return;
  if(favorites.has(key)) favorites.delete(key); else favorites.add(key);
      persistFavorites();
  updateAudioFavStar();
  if(showingFavorites) renderFavoritesView();
});

const audioPlayBtn = document.getElementById('audioPlay');
const audioPlayIcon = document.getElementById('audioPlayIcon');
const PLAY_PATH = '<path d="M8 5v14l11-7z"/>';
const PAUSE_PATH = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

audioEl.addEventListener('timeupdate', ()=>{
  document.getElementById('audioSeek').value = audioEl.currentTime;
  document.getElementById('audioCurTime').textContent = formatTime(audioEl.currentTime);
});
audioEl.addEventListener('loadedmetadata', ()=>{
  if(isFinite(audioEl.duration) && audioEl.duration > 0){
    document.getElementById('audioSeek').max = audioEl.duration;
    document.getElementById('audioDurTime').textContent = formatTime(audioEl.duration);
  }
});
audioEl.addEventListener('ended', ()=>{
  const queue = currentQueue();
  if(audioIndex < queue.length - 1) changeTrack(1);
  else { audioPlaying = false; audioPlayIcon.innerHTML = PLAY_PATH; }
});
audioEl.addEventListener('error', ()=>{
  audioPlaying = false;
  audioPlayIcon.innerHTML = PLAY_PATH;
});

audioPlayBtn.addEventListener('click', ()=>{
  if(currentQueue().length === 0) return;
  if(!trackLoaded){
    loadIndexPreservingState(0, true);
    return;
  }
  audioPlaying = !audioPlaying;
  audioPlayIcon.innerHTML = audioPlaying ? PAUSE_PATH : PLAY_PATH;
  if(audioPlaying) audioEl.play().catch(()=>{ audioPlaying = false; audioPlayIcon.innerHTML = PLAY_PATH; });
  else audioEl.pause();
});

function loadIndexPreservingState(i, forcePlay){
  const wasPlaying = audioPlaying || forcePlay;
  loadTrack(i, wasPlaying);
  if(!wasPlaying){
    audioPlaying = false;
    audioPlayIcon.innerHTML = PLAY_PATH;
  }
}

function changeTrack(delta){
  if(!trackLoaded) return;
  const queue = currentQueue();
  const next = audioIndex + delta;
  if(next < 0 || next > queue.length - 1) return;
  loadIndexPreservingState(next, audioPlaying);
}

document.getElementById('audioPrev').addEventListener('click', ()=> changeTrack(-1));
document.getElementById('audioNext').addEventListener('click', ()=> changeTrack(1));

document.getElementById('audioSeek').addEventListener('input', (e)=>{
  const t = parseInt(e.target.value, 10);
  audioEl.currentTime = t;
  document.getElementById('audioCurTime').textContent = formatTime(t);
});

document.getElementById('audioPrev').disabled = true;
document.getElementById('audioNext').disabled = true;

function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  const str = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById('clockOut').textContent = str;
  document.getElementById('miniClock').textContent = str;
}
tick();
setInterval(tick, 1000);

const MOBILE_BREAKPOINT = 760;
let mobileStep = 1;
const mq = window.matchMedia(`(max-width:${MOBILE_BREAKPOINT}px)`);

function applyMobileState(){
  const isMobile = mq.matches;
  document.body.classList.toggle('is-mobile', isMobile);
  if(isMobile){
    goToStep(mobileStep || 1);
  } else {
    document.body.removeAttribute('data-mobile-step');
  }
}

function goToStep(step){
  mobileStep = step;
  document.body.setAttribute('data-mobile-step', String(step));
  document.querySelectorAll('.mobile-step-dots span').forEach(dot=>{
    dot.classList.toggle('on', Number(dot.dataset.step) === step);
  });
}

mq.addEventListener ? mq.addEventListener('change', applyMobileState) : mq.addListener(applyMobileState);
applyMobileState();
</script>
